[project]
name = "airwork-agent"
version = "0.1.0"
description = "Control de Claude Code desde el celular (airwork, fase 2)"
authors = [
    { name = "hapcosa", email = "hapcosa@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk==0.2.159",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.15.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
airwork-agent = "airwork_agent:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: usa el CLI real de Claude (consume cuota)"]
addopts = "-m 'not live'"
